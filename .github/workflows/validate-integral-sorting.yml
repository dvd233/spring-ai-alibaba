name: Validate integral Store sorting

on:
  push:
    branches:
      - validation/spring-integral-sorting-20261006

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.repository == 'dvd233/spring-ai-alibaba' &&
      github.repository_id == '1407074502' &&
      github.repository_owner_id == '111864431' &&
      github.ref == 'refs/heads/validation/spring-integral-sorting-20261006' &&
      github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Check out this exact validation harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dvd233/spring-ai-alibaba
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .github/scripts/integral_sort
      - name: Check out the exact reviewed source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dvd233/spring-ai-alibaba
          ref: ace6f471d1228fcce2e9b1811e2389b970adf78b
          path: candidate
          fetch-depth: 2
          persist-credentials: false
      - name: Check out the original source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dvd233/spring-ai-alibaba
          ref: f82da0b50f35744c13968191be2b1cd2452ef550
          path: baseline
          fetch-depth: 1
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          overwrite-settings: false
      - name: Verify source bindings and validator self-tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence home m2 .maven
          regression=spring-ai-alibaba-graph-core/src/test/java/com/alibaba/cloud/ai/graph/store/stores/BaseStoreIntegralSortingTest.java
          cp "candidate/$regression" "baseline/$regression"
          scripts="$GITHUB_WORKSPACE/harness/.github/scripts/integral_sort"
          python3 "$scripts/test_check_reports.py" 2>&1 | tee evidence/validator-self-tests.log
          python3 - "$scripts" "$GITHUB_WORKSPACE" <<'PY'
          import sys
          sys.path.insert(0, sys.argv[1])
          from source_binding import verify
          verify(sys.argv[2])
          PY
          find "$scripts" -type f ! -path '*/__pycache__/*' -print0 | sort -z | xargs -0 sha256sum > evidence/harness-sha256.txt
          cat > evidence/settings.xml <<'XML'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0"><mirrors><mirror><id>official-central</id><url>https://repo.maven.apache.org/maven2</url><mirrorOf>*</mirrorOf></mirror></mirrors></settings>
          XML
          java -version 2>&1 | tee evidence/java-version.log
      - name: Prefetch dependencies and compile without running product tests
        shell: bash
        run: |
          set -euo pipefail
          export MAVEN_USER_HOME="$GITHUB_WORKSPACE/.maven"
          export MAVEN_OPTS="-Duser.home=$GITHUB_WORKSPACE/home -XX:-UsePerfData"
          common=(-B -ntp -s "$GITHUB_WORKSPACE/evidence/settings.xml" "-Dmaven.repo.local=$GITHUB_WORKSPACE/m2" -Dspotless.apply.skip=true -DskipTests -pl spring-ai-alibaba-graph-core)
          cd candidate
          ./mvnw -version | tee ../evidence/maven-version.log
          ./mvnw "${common[@]}" org.apache.maven.plugins:maven-dependency-plugin:3.5.0:go-offline | tee ../evidence/dependency-prefetch.log
          ./mvnw "${common[@]}" org.apache.maven.plugins:maven-dependency-plugin:3.5.0:get -Dartifact=org.apache.maven.surefire:surefire-junit-platform:3.1.2 -Dtransitive=true | tee ../evidence/surefire-provider-prefetch.log
          ./mvnw "${common[@]}" org.apache.maven.plugins:maven-dependency-plugin:3.5.0:get -Dartifact=com.google.googlejavaformat:google-java-format:1.24.0 -Dtransitive=true | tee ../evidence/spotless-formatter-prefetch.log
          ./mvnw "${common[@]}" test | tee ../evidence/candidate-compile-only.log
          cd ../baseline
          ./mvnw "${common[@]}" test | tee ../evidence/baseline-compile-only.log
      - name: Run fresh native baseline, candidate, audited Store tests, and style checks with IP egress disabled
        shell: bash
        run: |
          set -euo pipefail
          scripts="$GITHUB_WORKSPACE/harness/.github/scripts/integral_sort"
          for phase in baseline focused stores style; do
            env -i \
              HOME="$GITHUB_WORKSPACE/home" \
              JAVA_HOME="$JAVA_HOME" \
              PATH="$JAVA_HOME/bin:/usr/local/bin:/usr/bin:/bin" \
              MAVEN_USER_HOME="$GITHUB_WORKSPACE/.maven" \
              MAVEN_OPTS="-Duser.home=$GITHUB_WORKSPACE/home -XX:-UsePerfData" \
              LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \
              unshare --user --map-root-user --net --fork \
              python3 "$scripts/isolation_entry.py" "$GITHUB_WORKSPACE" "$phase" \
              2>&1 | tee "evidence/$phase-isolation.log"
          done
      - name: Save exact native reports, compiler metadata, logs, and bindings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integral-store-sorting-validation
          path: evidence/
          if-no-files-found: error
          retention-days: 14
